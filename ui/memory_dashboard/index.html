<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Observability Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; background: #f7f7f7; }
        h1 { color: #2c3e50; }
        .section { background: #fff; padding: 1em 2em; margin-bottom: 2em; border-radius: 8px; box-shadow: 0 2px 8px #0001; }
        .score { color: #2980b9; font-weight: bold; }
        .token { color: #16a085; }
        .retrieval { margin-bottom: 1em; }
        .summary { background: #eafaf1; padding: 0.5em; border-radius: 4px; }
        .lifecycle { color: #8e44ad; }
    </style>
</head>
<body>
    <h1>Memory Observability Dashboard</h1>
    <div class="section">
        <h2>Conversation Summary</h2>
        <div id="summary" class="summary">Loading...</div>
    </div>
    <div class="section">
        <h2>Semantic Memory Retrievals</h2>
        <div id="retrievals">Loading...</div>
    </div>
    <div class="section">
        <h2>Token Savings</h2>
        <div id="token-savings">Loading...</div>
    </div>
    <div class="section">
        <h2>Summarisation Lifecycle</h2>
        <div id="lifecycle">Loading...</div>
    </div>
    <div class="section">
        <h2>Tool Call Stats</h2>
        <div id="tool-stats">Loading...</div>
    </div>
    <script>
        async function fetchDashboard() {
            const res = await fetch('/memory_dashboard/data');
            const data = await res.json();
            document.getElementById('summary').textContent = data.summary;
            document.getElementById('retrievals').innerHTML = data.retrievals.map(r =>
                `<div class='retrieval'>
                    <div><b>Text:</b> ${r.text}</div>
                    <div><b>Score:</b> <span class='score'>${r.score.toFixed(2)}</span></div>
                    <div><b>Why retrieved:</b> ${r.why}</div>
                </div>`
            ).join('');
            document.getElementById('token-savings').innerHTML = `<span class='token'>${data.token_savings}</span> tokens saved by summarisation.`;
            document.getElementById('lifecycle').innerHTML = `<span class='lifecycle'>${data.lifecycle}</span>`;
            document.getElementById('tool-stats').innerHTML = (data.tool_stats && data.tool_stats.length > 0)
                ? `<table><tr><th>Tool</th><th>Retries</th><th>Error</th></tr>` +
                  data.tool_stats.map(ts =>
                    `<tr><td>${ts.name}</td><td>${ts.retries}</td><td>${ts.error ? `<span style='color:red'>${ts.error}</span>` : ''}</td></tr>`
                  ).join('') + `</table>`
                : 'No tool calls yet.';
        }
        fetchDashboard();
        setInterval(fetchDashboard, 2000);
    </script>
</body>
</html>
