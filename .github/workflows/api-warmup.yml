name: API Warmup

on:
  schedule:
    # Keep Container App warm to reduce cold-start latency.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-warmup
  cancel-in-progress: true

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Warm API health endpoint
        env:
          WARMUP_URL: https://grounded-agent-api.orangewave-2d52a1ea.eastus2.azurecontainerapps.io/health
        run: |
          set -euo pipefail
          echo "Warming $WARMUP_URL"
          status=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --connect-timeout 8 --max-time 15 "$WARMUP_URL" || true)
          echo "HTTP status: ${status}"
          cat /tmp/resp.txt || true

          # Do not fail workflow on transient warmup misses; this is best-effort.
          if [ "$status" != "200" ]; then
            echo "Warmup ping did not return 200 (best-effort), continuing."
          fi
