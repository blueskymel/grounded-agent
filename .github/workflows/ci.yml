name: CI

on:
  push:
  pull_request:

jobs:
  test-eval:
    runs-on: ubuntu-latest
    env:
      RETRIEVAL_BACKEND: faiss

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        working-directory: api
        run: |
          ruff check .

      - name: Unit tests
        working-directory: api
        run: |
          pytest -q

      - name: Build FAISS index for eval (fixtures, mock embeddings)
        working-directory: api
        run: |
          mkdir -p data/index
          python -m ingest.build_faiss_index --input_dir fixtures/raw --out_dir data/index --provider mock

      - name: Eval (subset) + write report
        working-directory: api
        run: |
          python -m eval.run_eval --limit 25

      - name: Eval threshold gate
        working-directory: api
        run: |
          python -m eval.gate --min_recall 0.80 --min_format 0.95 --min_refusal 0.95