name: Static Site Deploy

on:
  push:
    branches:
      - develop
      - main
    paths:
      - ui/groundedagent-ui/**
      - .github/workflows/static-site-deploy.yml
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Angular UI to Azure Static Web Apps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Note missing deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set."
            echo "Workflow will build and skip deployment until the secret is configured."
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: develop
          app_location: ui/groundedagent-ui
          api_location: ""
          output_location: dist/groundedagent-ui/browser
          app_build_command: npm ci && npm run build
          skip_api_build: true
          skip_deploy_on_missing_secrets: true
