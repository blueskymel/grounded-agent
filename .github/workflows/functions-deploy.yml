name: Functions Deploy

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Target resource group name"
        required: true
        type: string
      function_app_name:
        description: "Target Function App name"
        required: true
        type: string
      run_smoke_test:
        description: "Run /api/health check after deployment"
        required: true
        default: true
        type: boolean
      evidence_label:
        description: "Short label for deployment evidence artifact"
        required: false
        default: "functions-cutover"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      RETRIEVAL_BACKEND: faiss
      EMBEDDINGS_PROVIDER: mock
      LLM_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        working-directory: api
        run: |
          ruff check .

      - name: Unit tests
        working-directory: api
        run: |
          pytest -q

      - name: Build FAISS index for eval
        working-directory: api
        run: |
          mkdir -p data/index
          python -m ingest.build_faiss_index --input_dir fixtures/raw --out_dir data/index --provider mock

      - name: Run eval + write report
        working-directory: api
        run: |
          python -m eval.run_eval --limit 25

      - name: Eval threshold gate
        working-directory: api
        run: |
          python -m eval.gate --min_recall 0.80 --min_format 0.95 --min_refusal 0.95

  deploy:
    needs: [quality-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build function deployment package
        run: |
          set -euxo pipefail
          rm -rf .funcpkg
          mkdir -p .funcpkg
          cp functionapp/host.json .funcpkg/
          cp functionapp/function_app.py .funcpkg/
          cp functionapp/requirements.txt .funcpkg/
          cp -R api .funcpkg/api
          (cd .funcpkg && zip -r grounded-agent-function.zip .)

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy zip package to Function App
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ inputs.resource_group }}" \
            --name "${{ inputs.function_app_name }}" \
            --src ".funcpkg/grounded-agent-function.zip"

      - name: Smoke test
        if: ${{ inputs.run_smoke_test }}
        run: |
          set -euxo pipefail
          base_url="https://${{ inputs.function_app_name }}.azurewebsites.net"
          curl --fail --show-error --silent "${base_url}/api/health" | tee smoke-health.json

      - name: Post-deploy health verification (retry)
        run: |
          set -euxo pipefail
          base_url="https://${{ inputs.function_app_name }}.azurewebsites.net"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --show-error --silent "${base_url}/api/health" | tee postdeploy-health.json; then
              ok=1
              break
            fi
            echo "Health check attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo '{"status":"failed","reason":"post_deploy_health_check_failed"}' > postdeploy-health.json
            exit 1
          fi

      - name: Collect diagnostics on failure
        if: ${{ failure() }}
        run: |
          set -euxo pipefail
          mkdir -p deployment-evidence

          {
            echo "=== Deployment Diagnostics ==="
            echo "utc_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "resource_group=${{ inputs.resource_group }}"
            echo "function_app_name=${{ inputs.function_app_name }}"
            echo
            echo "--- az functionapp deployment list ---"
            az functionapp log deployment list \
              --resource-group "${{ inputs.resource_group }}" \
              --name "${{ inputs.function_app_name }}" -o table || true
            echo
            echo "--- az functionapp appsettings list (names only) ---"
            az functionapp config appsettings list \
              --resource-group "${{ inputs.resource_group }}" \
              --name "${{ inputs.function_app_name }}" \
              --query "[].name" -o tsv || true
          } > deployment-evidence/diagnostics.txt

          {
            echo "## Deployment Failure Diagnostics"
            echo "- Resource Group: ${{ inputs.resource_group }}"
            echo "- Function App: ${{ inputs.function_app_name }}"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build deployment evidence
        if: ${{ always() }}
        run: |
          set -euxo pipefail
          mkdir -p deployment-evidence
          base_url="https://${{ inputs.function_app_name }}.azurewebsites.net"

          {
            echo "label=${{ inputs.evidence_label }}"
            echo "resource_group=${{ inputs.resource_group }}"
            echo "function_app_name=${{ inputs.function_app_name }}"
            echo "base_url=${base_url}"
            echo "github_run_id=${{ github.run_id }}"
            echo "github_sha=${{ github.sha }}"
            echo "utc_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deployment-evidence/metadata.txt

          if [ -f smoke-health.json ]; then
            cp smoke-health.json deployment-evidence/smoke-health.json
          else
            echo '{"status":"skipped","reason":"run_smoke_test=false"}' > deployment-evidence/smoke-health.json
          fi

          if [ -f postdeploy-health.json ]; then
            cp postdeploy-health.json deployment-evidence/postdeploy-health.json
          else
            echo '{"status":"missing","reason":"post_deploy_verification_not_executed"}' > deployment-evidence/postdeploy-health.json
          fi

          {
            echo "## Functions Deployment Evidence"
            echo "- Label: ${{ inputs.evidence_label }}"
            echo "- Resource Group: ${{ inputs.resource_group }}"
            echo "- Function App: ${{ inputs.function_app_name }}"
            echo "- Endpoint: ${base_url}/api/health"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.evidence_label }}-${{ github.run_id }}
          path: deployment-evidence
