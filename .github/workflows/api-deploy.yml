name: API Deploy

on:
  push:
    paths:
      - 'api/**'
      - 'docker/api.Dockerfile'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
      AZURE_CONTAINERAPP_RESOURCE_GROUP: ${{ secrets.AZURE_CONTAINERAPP_RESOURCE_GROUP }}
      AZURE_CONTAINERAPP_NAME: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      SAFE_MIN_CITATION_CONFIDENCE: ${{ vars.SAFE_MIN_CITATION_CONFIDENCE }}
      MIN_CITATION_SCORE_TO_DISPLAY: ${{ vars.MIN_CITATION_SCORE_TO_DISPLAY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment secrets
        id: precheck
        run: |
          missing=0
          for key in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_ACR_NAME \
            AZURE_ACR_LOGIN_SERVER \
            AZURE_CONTAINERAPP_RESOURCE_GROUP \
            AZURE_CONTAINERAPP_NAME
          do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: ${key}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing required Azure deploy secrets. Failing this run so non-deploy is explicit."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push API image
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        run: |
          set -euxo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE="${AZURE_ACR_LOGIN_SERVER}/grounded-agent-api:${IMAGE_TAG}"

          USE_AOAI=false
          BUILD_ARGS=()
          if [ -n "${AZURE_OPENAI_ENDPOINT}" ] && [ -n "${AZURE_OPENAI_API_KEY}" ] && [ -n "${AZURE_OPENAI_API_VERSION}" ] && [ -n "${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT}" ]; then
            USE_AOAI=true
            BUILD_ARGS+=(--build-arg "AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}")
            BUILD_ARGS+=(--build-arg "AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}")
            BUILD_ARGS+=(--build-arg "AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}")
            BUILD_ARGS+=(--build-arg "AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT=${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT}")
          fi

          az acr login --name "${AZURE_ACR_NAME}"
          docker build -f docker/api.Dockerfile -t "${IMAGE}" "${BUILD_ARGS[@]}" .
          docker push "${IMAGE}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "USE_AOAI=${USE_AOAI}" >> "$GITHUB_ENV"

      - name: Update Azure Container App
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        run: |
          set -euxo pipefail
          SAFE_CONF="${SAFE_MIN_CITATION_CONFIDENCE:-0.35}"
          MIN_DISPLAY="${MIN_CITATION_SCORE_TO_DISPLAY:-0.25}"
          if [ "${USE_AOAI}" = "true" ]; then
            az containerapp update \
              --name "${AZURE_CONTAINERAPP_NAME}" \
              --resource-group "${AZURE_CONTAINERAPP_RESOURCE_GROUP}" \
              --image "${IMAGE}" \
              --set-env-vars \
                LLM_PROVIDER=aoai \
                EMBEDDINGS_PROVIDER=aoai \
                AZURE_OPENAI_ENDPOINT="${AZURE_OPENAI_ENDPOINT}" \
                AZURE_OPENAI_API_KEY="${AZURE_OPENAI_API_KEY}" \
                AZURE_OPENAI_API_VERSION="${AZURE_OPENAI_API_VERSION}" \
                AZURE_OPENAI_CHAT_DEPLOYMENT="${AZURE_OPENAI_CHAT_DEPLOYMENT}" \
                AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT="${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT}" \
                SAFE_MIN_CITATION_CONFIDENCE="${SAFE_CONF}" \
                MIN_CITATION_SCORE_TO_DISPLAY="${MIN_DISPLAY}"
          else
            az containerapp update \
              --name "${AZURE_CONTAINERAPP_NAME}" \
              --resource-group "${AZURE_CONTAINERAPP_RESOURCE_GROUP}" \
              --image "${IMAGE}" \
              --set-env-vars \
                LLM_PROVIDER=mock \
                EMBEDDINGS_PROVIDER=mock \
                SAFE_MIN_CITATION_CONFIDENCE="${SAFE_CONF}" \
                MIN_CITATION_SCORE_TO_DISPLAY="${MIN_DISPLAY}"
          fi

      - name: Smoke test API health endpoint
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        run: |
          set -euxo pipefail
          FQDN=$(az containerapp show \
            --name "${AZURE_CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_CONTAINERAPP_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          curl --fail --show-error --silent "https://${FQDN}/health"
